<html>
<title>Exam Arrangements</title>
	<head>
		<meta charset="utf-8">
		<script src="wasm_exec.js"></script>
		<script>
			const go = new Go();
			WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((result) => {
				go.run(result.instance);
			});
		</script>
	</head>
	<body>
        <h1>Exam Arrangements</h1>
	<div id="main"> 
        <input type="file" id="fileinput">
        <button id="generateButton" disabled="true">Generate</button>
        <button id="checkButton" disabled="true">Run Checks</button>
        <div id="checks">
        </div>
        <div id="downloads">
        </div>
	</div>
	</body>
</html>
